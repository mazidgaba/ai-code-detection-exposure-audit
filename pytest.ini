; kaggle/upload/ holds a copy of the aicd package that was zipped up as a
; Kaggle dataset. Its tests have the same module names as the real ones, so
; collecting both makes pytest abort with an import-file-mismatch before a
; single test runs. Confine collection to the source of truth.
[pytest]
testpaths = aicd/tests
norecursedirs = kaggle .git artifacts paper/submission
